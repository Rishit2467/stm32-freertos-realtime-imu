[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200

lib_deps =
    https://github.com/FreeRTOS/FreeRTOS-Kernel.git#V10.5.1

lib_archive = no
extra_scripts = pre:filter_freertos.py

build_flags =
    -Iinclude
    -I.pio/libdeps/nucleo_f103rb/FreeRTOS-Kernel/include
    -I.pio/libdeps/nucleo_f103rb/FreeRTOS-Kernel/portable/GCC/ARM_CM3
    -Wl,-u,_printf_float
    -DSTM32F103xB