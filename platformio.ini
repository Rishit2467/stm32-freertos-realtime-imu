[env:nucleo_f103rb]
platform = ststm32
board = nucleo_f103rb
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200

; Pull a clean Cortex-M3 FreeRTOS kernel port
lib_deps =
    https://github.com/FreeRTOS/FreeRTOS-Kernel.git#V10.5.1

build_flags =
    -Iinclude
    -Wl,-u,_printf_float
    -DSTM32F103xB

; Compile only the GCC ARM Cortex-M3 port and heap_4 memory manager
lib_Archive = no
build_src_filter =
    +<*>
    +<../.pio/libdeps/nucleo_f103rb/FreeRTOS-Kernel/*.c>
    +<../.pio/libdeps/nucleo_f103rb/FreeRTOS-Kernel/portable/GCC/ARM_CM3/*.c>
    +<../.pio/libdeps/nucleo_f103rb/FreeRTOS-Kernel/portable/MemMang/heap_4.c>
    -<../.pio/libdeps/nucleo_f103rb/FreeRTOS-Kernel/portable/Common/*>